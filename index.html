<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Codex Credits</title></head><body><div id="app"></div>
<script>
// Diagnose a module initialization error before the Tauri IPC is even called.
// Only replace the loading placeholder; do not mask ordinary runtime errors.
(function(){
 function display(reason){
  const label=document.getElementById("account");
  if(label && label.textContent && label.textContent.includes("載入本機")){
   label.textContent="介面初始化失敗："+String(reason).slice(0,240);
  }
 }
 window.addEventListener("error",function(e){display(e.message||"JavaScript 錯誤");});
 window.addEventListener("unhandledrejection",function(e){
  display(e.reason&&e.reason.message||e.reason||"非同步執行錯誤");
 });
})();
</script>
<script type="module" src="/src/main.ts"></script></body></html>
