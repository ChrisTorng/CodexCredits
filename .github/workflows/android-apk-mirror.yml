name: Publish signed Android APK to CodexCredits direct download

on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-apk-mirror.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codexcredits-direct-android-apk
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download verified v2.0.12 signed APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=codexcredits-android-v2.0.12-release
          SOURCE=ChrisTorng/android-codex-tools
          NAME=CodexCredits-Android-v2.0.12-arm64.apk
          mkdir -p "$RUNNER_TEMP/android-apk"
          gh release download "$TAG" -R "$SOURCE" --pattern "$NAME" --dir "$RUNNER_TEMP/android-apk"
          APK="$RUNNER_TEMP/android-apk/$NAME"
          test -s "$APK"
          EXPECTED=$(gh api "repos/$SOURCE/releases/tags/$TAG" |
            jq -r --arg name "$NAME" '.assets[] | select(.name == $name) | .digest')
          ACTUAL="sha256:$(sha256sum "$APK" | cut -d' ' -f1)"
          test "$EXPECTED" = "$ACTUAL" || { echo "::error::APK SHA-256 digest mismatch"; exit 1; }
          unzip -tq "$APK"
          test "$ACTUAL" = "sha256:a7b9c458be8e0d5a15e9c7b2efdc96634481fe43a85a8a796b3e6afcc7a1aeaa"
          test "$(wc -c < "$APK")" -eq 10259111
          cp "$APK" "$RUNNER_TEMP/CodexCredits-Android.apk"
          printf 'version=2.0.12\ntag=%s\nsource_commit=fc66e7767055b1fadc47644a58d43b7f151dcdf4\n%s\n' "$TAG" "$ACTUAL" > "$RUNNER_TEMP/VERSION.txt"
          echo "Verified: $NAME $(wc -c < "$APK") bytes $ACTUAL"

      - name: Publish static one-tap download from CodexCredits
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin apk-download >/dev/null; then
            git fetch origin apk-download
            git checkout -B apk-download FETCH_HEAD
          else
            git checkout --orphan apk-download
            git rm -rf . >/dev/null
          fi
          cp "$RUNNER_TEMP/CodexCredits-Android.apk" CodexCredits-Android.apk
          cp "$RUNNER_TEMP/VERSION.txt" VERSION.txt
          git add CodexCredits-Android.apk VERSION.txt
          if git diff --cached --quiet; then
            echo "Already up to date"
          else
            git commit -m 'release(android): mirror verified signed Codex Credits v2.0.12 APK'
            git push origin HEAD:apk-download
          fi
          echo "Direct APK: https://raw.githubusercontent.com/ChrisTorng/CodexCredits/apk-download/CodexCredits-Android.apk"
