name: Windows Build
on:
  push:
    branches: [main, android-parity, 'diagnostic/v2.0.27-old-ui-new-backend']
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate correct transparent Android/Windows branding
        shell: pwsh
        run: |
          python -m pip install --quiet Pillow
          python scripts/prepare_app_icons.py
      - run: npm install
      - run: npm run build
      - run: npm run test:charts
      - name: Check shared branding and package IDs
        run: python mobile/android/check_branding.py
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --no-bundle
      - name: Build Windows NSIS installer for native notifications
        run: npm run tauri bundle -- --bundles nsis
      - name: Verify Windows small/large icons inside EXE and installer
        shell: pwsh
        run: |
          python -m pip install --quiet pefile
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw "Expected exactly one Windows installer" }
          python scripts/verify_windows_icons.py src-tauri/target/release/CodexCredits.exe $installer[0].FullName
      - name: Stage portable files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item src-tauri/target/release/CodexCredits.exe release/
          Copy-Item README.md,LICENSE release/
          $setups = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($setups.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          if (-not $setups[0].Name.Contains('2.0.27')) { throw 'NSIS filename missing v2.0.27' }
          $setups | ForEach-Object { Copy-Item $_.FullName release/ }
          Get-ChildItem release/ | Select-Object Name,Length
      # GitHub Actions artifact already downloads as a ZIP; avoid nesting a second ZIP.
      - uses: actions/upload-artifact@v4
        with:
          name: CodexCredits-Windows-v2.0.27-x64
          path: release/
          if-no-files-found: error
