name: Windows Build
on:
  push:
    branches: [main, android-parity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npm run test:charts
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --no-bundle
      - name: Build Windows NSIS installer for native notifications
        run: npm run tauri bundle -- --bundles nsis
      - name: Stage portable files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item src-tauri/target/release/CodexCredits.exe release/
          Copy-Item README.md,LICENSE release/
          $setups = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($setups.Count -eq 0) { throw 'NSIS installer missing' }
          $setups | ForEach-Object { Copy-Item $_.FullName release/ }
          Get-ChildItem release/ | Select-Object Name,Length
      # GitHub Actions artifact already downloads as a ZIP; avoid nesting a second ZIP.
      - uses: actions/upload-artifact@v4
        with:
          name: CodexCredits-Windows-x64
          path: release/
          if-no-files-found: error
